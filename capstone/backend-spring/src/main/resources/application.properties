# Server Port (Port 9090 assigned - non-conflicting!)
server.port=${PORT:9090}

# Aiven Cloud PostgreSQL Connection (SSL required)
# Override these via Environment Variables or application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Spatial Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Python Satellite ML Microservice (Assigned Port 7000)
python.ai.service.url=${PYTHON_AI_SERVICE_URL:http://localhost:7000}
