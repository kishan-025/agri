# Server Port (Defaults to 9090 locally, or uses $PORT from cloud environments like Render/Docker)
server.port=${PORT:9090}

# Embedded Tomcat Tuning for low-memory container environments (Vercel/Render)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100

# Aiven Cloud PostgreSQL Connection (SSL required)
# Override these via Environment Variables or application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Optimization for Aiven Cloud PostgreSQL
# (Aiven Hobby/Free tier has max_connections=20. Setting pool size to 3 prevents
# "FATAL: remaining connection slots are reserved for roles with the SUPERUSER attribute")
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA & Hibernate Spatial Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Python Satellite ML Microservice (Assigned Port 7000 locally, or via environment)
python.ai.service.url=${PYTHON_AI_SERVICE_URL:http://localhost:7000}
