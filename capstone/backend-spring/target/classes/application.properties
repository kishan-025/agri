# Server Port (Port 9090 assigned - non-conflicting!)
server.port=9090

# Aiven Cloud PostgreSQL Connection (SSL required)
# You can override these via Environment Variables or pass directly
spring.datasource.url=${AIVEN_PG_URL:jdbc:postgresql://localhost:5432/defaultdb?sslmode=require}
spring.datasource.username=${AIVEN_PG_USER:avnadmin}
spring.datasource.password=${AIVEN_PG_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Spatial Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 Client ID for Token Verification
google.client.id=${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}

# Python Satellite ML Microservice (Assigned Port 7000)
python.ai.service.url=http://localhost:7000
